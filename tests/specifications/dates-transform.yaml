openapi: 3.0.0
info:
  title: Dates transform
  version: 1.0.0
paths:
  /orders/{orderId}:
    get:
      operationId: getOrderDetails
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetails'
  /pets/{petId}:
    get:
      operationId: getPetProfile
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Cat'
                  - $ref: '#/components/schemas/Dog'
                discriminator:
                  propertyName: petType
                  mapping:
                    cat: '#/components/schemas/Cat'
                    dog: '#/components/schemas/Dog'
  /audits/{auditId}:
    get:
      operationId: getAuditRecord
      parameters:
        - name: auditId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: readOnly, allOf-wrapped and recursive shapes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRecord'
  /shelters/{shelterId}/pets:
    get:
      operationId: listShelterPets
      responses:
        '200':
          description: discriminator mapping given as bare component names
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Cat'
                  - $ref: '#/components/schemas/Dog'
                discriminator:
                  propertyName: petType
                  mapping:
                    cat: Cat
                    dog: Dog
      parameters:
        - name: shelterId
          in: path
          required: true
          schema: { type: string }
  /orders:
    get:
      operationId: listOrderNumbers
      responses:
        '200':
          description: dates-free — must generate no deserializer
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /appointments:
    put:
      operationId: updateAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Appointment'
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
  /appointments/duplicate-date:
    put:
      operationId: updateAppointmentDuplicateDate
      # `AppointmentWithDuplicateDate` re-declares `day` on an allOf branch
      # sibling to the branch that inherits it — a common idiom for adding a
      # description to an inherited property — so the request walk converts
      # `day` twice. The conversion must be idempotent, or the second pass
      # throws trying to call `.toISOString()` on the string the first pass
      # produced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentWithDuplicateDate'
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentWithDuplicateDate'
  /appointments/{appointmentId}/reminder:
    patch:
      operationId: updateAppointmentReminder
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      # `required` intentionally omitted — OpenAPI defaults an unmarked
      # requestBody to optional, so the generated prop is `reminderUpdate?:
      # ReminderUpdate` and the argument type is `ReminderUpdate | undefined`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderUpdate'
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
components:
  schemas:
    Cat:
      type: object
      required: [petType, vaccinatedAt]
      properties:
        petType: { type: string, enum: [cat] }
        vaccinatedAt: { type: string, format: date-time }
    Dog:
      type: object
      required: [petType]
      properties:
        petType: { type: string, enum: [dog] }
        adoptedAt: { type: string, format: date-time, nullable: true }
    OrderDetails:
      type: object
      required: [placedAt, events]
      properties:
        placedAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time, nullable: true }
        lastViewedAt: { type: string, format: date-time }
        name: { type: string }
        events:
          type: array
          items:
            $ref: '#/components/schemas/OrderEvent'
    OrderEvent:
      type: object
      required: [createdAt]
      properties:
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        message: { type: string }
    AuditRecord:
      type: object
      required: [recordedAt, stamps, tree]
      properties:
        # readOnly properties are generated with a `readonly` modifier
        recordedAt: { type: string, format: date-time, readOnly: true }
        # allOf-wrapped date elements must be written back through the slot
        stamps:
          type: array
          items:
            allOf:
              - { type: string, format: date-time }
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        # recursive: emits nothing rather than converting only the first level
        tree:
          $ref: '#/components/schemas/AuditNode'
    AuditEntry:
      type: object
      required: [changedAt]
      properties:
        changedAt: { type: string, format: date-time, readOnly: true }
        note: { type: string }
    AuditNode:
      type: object
      required: [createdAt, children]
      properties:
        createdAt: { type: string, format: date-time }
        children:
          type: array
          items:
            $ref: '#/components/schemas/AuditNode'
    Appointment:
      type: object
      required: [day, bookedAt, slots]
      properties:
        day: { type: string, format: date }
        bookedAt: { type: string, format: date-time }
        reminderOn: { type: string, format: date, nullable: true }
        slots:
          type: array
          items:
            type: object
            required: [start]
            properties:
              start: { type: string, format: date }
              label: { type: string }
    ReminderUpdate:
      type: object
      properties:
        remindOn: { type: string, format: date }
    AppointmentBase:
      type: object
      required: [day]
      properties:
        day: { type: string, format: date }
    AppointmentWithDuplicateDate:
      allOf:
        - $ref: '#/components/schemas/AppointmentBase'
        - type: object
          required: [day]
          properties:
            # Re-declares the inherited `day` just to add a description —
            # the request walk converts it once per allOf branch.
            day:
              type: string
              format: date
              description: 're-declared to add a description'
