openapi: 3.0.1
info:
  title: All Of Primitive
  version: v1.0
paths:
  /pets:
    get:
      operationId: get-pets
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Pets'
                type: array
          description: OK
components:
  schemas:
    Pets:
      required:
        - operationRef
      properties:
        petId:
          allOf:
            - $ref: '#/components/schemas/DogId'
            - $ref: '#/components/schemas/CatId'
          nullable: true
        operationRef:
          allOf:
            - $ref: '#/components/schemas/OperationRef'
            - description: Reference to the operation
        optionalRef:
          allOf:
            - $ref: '#/components/schemas/OperationRef'
            - description: Optional variant of the same idiom
    DogId:
      nullable: true
      type: string
    CatId:
      description: test
      type: string
    OperationRef:
      type: string
      enum:
        - form
        - function
        - question
