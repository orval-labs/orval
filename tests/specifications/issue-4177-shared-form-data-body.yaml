openapi: '3.1.0'
info:
  version: 1.0.0
  title: 'Issue #4177 — multipart body aliased as a shared schema'
  license:
    name: MIT
servers:
  - url: http://example.com/v1
paths:
  # orval-labs/orval#4177: the multipart body is a $ref to a component schema
  # instead of an inline object, so the emitted `Upload` model is generated by
  # generateSchemasDefinition rather than by the operation. Without the
  # form-data context carried over, its binary parts fell back to `Blob` while
  # the inline body below got `Blob | File`.
  /upload:
    post:
      operationId: uploadShared
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/upload'
            encoding:
              report:
                contentType: text/csv
      responses:
        '204':
          description: Accepted
  /upload-inline:
    post:
      operationId: uploadInline
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                bar:
                  type: string
                files:
                  type: array
                  items:
                    type: string
                    contentMediaType: application/octet-stream
      responses:
        '204':
          description: Accepted
  # The same component is also a JSON response here: widening a request-body
  # part is safe, so `Metadata` must stay untouched by the multipart index.
  /metadata:
    get:
      operationId: getMetadata
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/metadata'
components:
  schemas:
    upload:
      type: object
      properties:
        bar:
          type: string
        report:
          type: string
        avatar:
          type: string
          format: binary
        files:
          type: array
          items:
            type: string
            contentMediaType: application/octet-stream
    metadata:
      type: object
      properties:
        checksum:
          type: string
          contentMediaType: application/octet-stream
