openapi: '3.0.0'
info:
  version: 1.0.0
  title: Angular JSON-only Multi-Content Test
  description: Multi-content response that declares no text media type
paths:
  /items/{id}:
    get:
      summary: Get an item in two JSON media types
      operationId: getItem
      tags:
        - items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item in two JSON flavours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Item'
components:
  schemas:
    Item:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
