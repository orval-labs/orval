      oneOf:
        - const: ACTIVE
          title: Active
          description: Active status
        - const: LEGACY
          title: Legacy
          description: Legacy status
          deprecated: true
        - type: 'null'
    NullableEnumAnyOf:
      anyOf:
        - type: string
          enum:
            - ACTIVE
            - LEGACY
        - type: 'null'
