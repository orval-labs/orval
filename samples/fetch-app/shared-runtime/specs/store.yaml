openapi: '3.0.0'
info:
  version: 1.0.0
  title: Store
  license:
    name: MIT
paths:
  /inventory:
    get:
      summary: List inventory items by status
      operationId: listInventory
      tags:
        - inventory
      parameters:
        - name: status
          in: query
          required: false
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/InventoryStatus'
      responses:
        '200':
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryItem'
  /orders:
    post:
      summary: Place an order
      operationId: placeOrder
      tags:
        - orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: Placed order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders/{orderId}:
    get:
      summary: Find an order by id
      operationId: getOrder
      tags:
        - orders
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
    delete:
      summary: Cancel an order
      operationId: cancelOrder
      tags:
        - orders
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Order cancelled
components:
  schemas:
    InventoryStatus:
      type: string
      enum:
        - available
        - reserved
        - sold
    InventoryItem:
      type: object
      required:
        - sku
        - status
        - quantity
      properties:
        sku:
          type: string
        status:
          $ref: '#/components/schemas/InventoryStatus'
        quantity:
          type: integer
    NewOrder:
      type: object
      required:
        - sku
        - quantity
      properties:
        sku:
          type: string
        quantity:
          type: integer
    Order:
      allOf:
        - $ref: '#/components/schemas/NewOrder'
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
    NotFound:
      type: object
      required:
        - message
      properties:
        message:
          type: string
